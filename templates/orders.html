{% extends 'base.html' %}{% block title %}Orders{% endblock %}{% block content %}<h1>My Orders</h1><table class="table"><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.created_at}}</td><td>₹{{"%.0f"|format(o.total)}}</td><td>{{o.status}}</td></tr>{% else %}<tr><td colspan="4">No orders yet.</td></tr>{% endfor %}</table>{% endblock %}
