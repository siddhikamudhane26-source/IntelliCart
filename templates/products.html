{% extends 'base.html' %}{% block title %}Products{% endblock %}{% block content %}<h1>Product Marketplace</h1>
<form class="search"><input name="q" placeholder="Search products..." value="{{search}}"><select name="category"><option value="">All categories</option>{% for c in categories %}<option {% if c==category %}selected{% endif %}>{{c}}</option>{% endfor %}</select><select name="sort"><option value="featured">Featured</option><option value="price_low">Price low</option><option value="price_high">Price high</option><option value="rating">Top rating</option></select><button class="btn">Search</button></form>
<div class="grid">{% for p in products %}{% include 'product_card.html' %}{% else %}<p>No products found.</p>{% endfor %}</div>{% endblock %}
