<div class="product"><a href="{{url_for('product',pid=p.id)}}"><img src="{{p.image}}" alt="{{p.name}}"></a><div class="product-body"><span class="badge">{{p.category}}</span><h3>{{p.name}}</h3><span>⭐ {{p.rating}}</span><div class="price">₹{{"%.0f"|format(p.price)}}</div><form method="post" action="{{url_for('add_cart',pid=p.id)}}"><button class="btn" type="submit">Add to cart</button></form></div></div>
